<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Scanner</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <!-- PWA Manifest Link -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#2e7d32">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3388/3388614.png">
</head>
<body>

  <!-- Overlay -->
  <div id="overlay" onclick="toggleSidebar()"></div>

  <!-- Sidebar -->
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <h2>Menu</h2>
      <button class="close-btn" onclick="toggleSidebar()">&times;</button>
    </div>
    <nav class="sidebar-nav">
      <a href="index.html" class="nav-item active"><span class="icon">📷</span> SCANNER</a>
      <a href="notes.html" class="nav-item"><span class="icon">📝</span> NOTE</a>
      <a href="settings.html" class="nav-item"><span class="icon">⚙️</span> SETTINGS</a>
    </nav>
  </aside>

  <!-- Main Content -->
  <div class="main-wrapper">
    <header class="top-bar">
      <button class="menu-btn" onclick="toggleSidebar()">☰ Menu</button>
      <!-- Set default state to Offline so it only shows Online if the test passes -->
<span id="status-badge" class="status-badge offline">Offline</span>
    </header>

    <main class="content-container">
    <!-- Inside index.html -> <main class="content-container"> -->
<div class="card">
  <h2>QR Scanner</h2>
  <!-- Clean scanner wrapper inside index.html -->
<div id="reader-wrapper" style="width: 100%; max-width: 480px; margin: 0 auto;">
  <div id="reader"></div>

  <div class="camera-select-group">
    <label for="camera-select">Select Camera:</label>
    <select id="camera-select"></select>
    <button id="toggle-scan-btn" class="primary-btn" style="margin-top: 8px;" onclick="toggleScanning()">Start Scanning</button>
  </div>

  <!-- Updated Viewport with Video and Tracker Canvas -->
  <div class="scanner-viewport" style="position: relative; width: 100%; max-width: 600px; margin: 15px auto 0; background: #000; border-radius: 8px; overflow: hidden;">
    <video id="webcam" autoplay playsinline muted style="width: 100%; display: block;"></video>
    <canvas id="tracker-canvas" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;"></canvas>
  </div>
</div>
  <div id="queue-banner" class="queue-banner hidden" style="margin-top: 15px;">
    <strong>Offline Queue:</strong> <span id="queue-count">0</span> scans waiting to sync.
  </div>

  <div class="last-scanned">
    <small>LAST SCANNED:</small>
    <p id="last-result">None</p>
  </div>
</div>
    </main>
  </div>

  <script src="app.js"></script>
  <script src="menu.js"></script>
</body>
</html>
